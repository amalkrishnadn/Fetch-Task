<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Quotes</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background-color: #f5f7fa;
      }

      .table-card {
        border: none;
        border-radius: 15px;
        overflow: hidden;
      }

      .table thead th {
        padding: 16px;
        white-space: nowrap;
      }

      .table tbody td {
        padding: 16px;
      }

      .table tbody tr {
        transition: 0.2s;
      }

      .table tbody tr:hover {
        background-color: #f1f5ff;
      }

      .comment-text {
        max-width: 500px;
        min-width: 300px;
      }

      .email {
        color: #0d6efd;
        text-decoration: none;
      }

      .email:hover {
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <a href="./second.html">Task 2</a>
    <a href="./third.html">Task 3</a>
    <div class="container py-5">
      <!-- Page Header -->
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Quotes</h2>
        <p class="text-muted mb-0">User quotes and author details</p>
      </div>

      <!-- Table Card -->
      <div class="card table-card shadow-sm">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>ID</th>
                  <th>Author</th>
                  <th>Quote</th>
                </tr>
              </thead>

              <!-- Fetch API data will be inserted here -->
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    fetch("https://dummyjson.com/quotes")
      .then((res) => {
        res
          .json()
          .then((result) => {
            console.log(result);

            let tableBody = document.querySelector("#tableBody");

            result.quotes.map(
              (eachProduct) =>
                (tableBody.innerHTML += `
              <tr>
                <td>${eachProduct?.id}</td>

                <td>
                  <span class="badge text-bg-primary">
                    ${eachProduct?.author}
                  </span>
                </td>

                <td class="fw-semibold">
                  ${eachProduct?.quote}
                </td>
              </tr>
            `),
            );
          })
          .catch((error) => {
            console.log(error);
          });
      })
      .catch((err) => {
        console.log(err);
      });
  </script>
</html>
