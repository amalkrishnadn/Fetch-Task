<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body>

    <div class="container mt-5">

        <h2 class="mb-4">Post</h2>

        <div id="output"></div>

    </div>

</body>

<script>

   fetch("https://dummyjson.com/posts")
  .then((res) => {
    res
      .json()
      .then((result) => {
        console.log(result);

        let output = document.getElementById("output");

        result.posts.map(
          (eachPost) =>
            (output.innerHTML += `
              <div class="card mb-3">
                <div class="card-body">

                  <h5 class="card-title">
                    ${eachPost?.title}
                  </h5>

                  <p class="card-text">
                    ${eachPost?.body}
                  </p>

                  <p class="mb-2">
                    <strong>User ID:</strong>
                    ${eachPost?.userId}
                  </p>

                  <p class="mb-2">
                    <strong>Views:</strong>
                    ${eachPost?.views}
                  </p>

                  <p class="mb-2">
                    <strong>Likes:</strong>
                    ${eachPost?.reactions?.likes}
                  </p>

                </div>
              </div>
            `),
        );
      })
      .catch((error) => {
        console.log(error);
      });
  })
  .catch((err) => {
    console.log(err);
  });

</script>

</html>
